name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch makes an older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Fail instead of skipping the DBSchema integration tests if Docker is missing
  DBSCHEMA_REQUIRE_DOCKER: true

jobs:
  build-and-test:
    # This job's name is the required status check on master
    name: Build and test
    # Ubuntu runners have Docker, which the DBSchema integration tests need for SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ScorpioConcepts.Framework.slnx

      - name: Build
        run: dotnet build ScorpioConcepts.Framework.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test --solution ScorpioConcepts.Framework.slnx -c Release --no-build
          --report-xunit-trx --results-directory "${{ github.workspace }}/artifacts/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack ScorpioConcepts.Framework.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
